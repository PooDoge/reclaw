[package]
name = "reclaw-ui"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Real gamepad reading (needs libudev on Linux).
gamepad = ["reclaw-input/gilrs-backend"]
# Invented games and projects for the integration tests (`fixtures`); the program has none.
fixtures = ["reclaw-games/fixtures"]

[dependencies]
freya = { version = "=0.5.0-rc.8", features = ["router", "radio", "query", "borderless", "titlebar", "markdown", "engine"] }
freya-router = "=0.5.0-rc.8"
freya-icons = { version = "=0.5.0-rc.8", features = ["lucide"] }
bytes = "1"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
reclaw-input = { path = "../reclaw-input" }
reclaw-runtime = { path = "../reclaw-runtime" }
reclaw-games = { path = "../reclaw-games" }
reclaw-config = { path = "../reclaw-config" }
reclaw-media = { path = "../reclaw-media" }
reclaw-catalog = { path = "../reclaw-catalog" }
reclaw-sync = { path = "../reclaw-sync" }
reclaw-net = { path = "../reclaw-net" }
reclaw-log = { path = "../reclaw-log" }
tracing = "0.1"

[dev-dependencies]
reclaw-ui = { path = ".", features = ["fixtures"] }
tempfile = "3"
serde_json = "1"
freya-testing = "=0.5.0-rc.8"
freya-core = "=0.5.0-rc.8"
png = "0.17"
