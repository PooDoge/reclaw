[package]
name = "reclaw-ui"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Real gamepad reading for the deck example (needs libudev on Linux).
gamepad = ["reclaw-input/gilrs-backend"]

[[example]]
name = "deck"
required-features = ["gamepad"]

[dependencies]
freya = { version = "=0.5.0-rc.8", features = ["router", "radio", "query", "borderless", "titlebar", "markdown", "remote-asset", "html", "engine"] }
freya-router = "=0.5.0-rc.8"
freya-icons = { version = "=0.5.0-rc.8", features = ["lucide"] }
bytes = "1"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
reclaw-input = { path = "../reclaw-input" }
reclaw-runtime = { path = "../reclaw-runtime" }
reclaw-games = { path = "../reclaw-games" }
reclaw-config = { path = "../reclaw-config" }
reclaw-media = { path = "../reclaw-media" }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
freya-testing = "=0.5.0-rc.8"
freya-core = "=0.5.0-rc.8"
