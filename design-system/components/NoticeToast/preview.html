<!-- @dsCard group="Activity" height=560 subtitle="The newest notification, with the two press-and-hold prompts; the ring fills while the button is held" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap">
<style>body{margin:0;padding:24px;background:var(--bg-base);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.cap{font:700 11px/14px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-subtle);margin:0 0 6px}body{background:var(--deck-bg)}</style></head>
<body><div id="r" data-theme="midnight"></div><script>
var R=window.Reclaw,h=React.createElement;
function App(){return h("div",{style:{display:"flex",flexWrap:"wrap",gap:24,alignItems:"flex-start"}},
  h("div",null,h("div",{className:"ac-cap"},"At rest, Xbox"),h(R.NoticeToast,{kind:"xbox",tone:"update",title:"Update ready: Starfall 64",body:"Version 1.4.3 is ready to install."})),
  h("div",null,h("div",{className:"ac-cap"},"Holding X, 45%"),h(R.NoticeToast,{kind:"xbox",tone:"update",title:"Update ready: Starfall 64",body:"Version 1.4.3 is ready to install.",holding:"x",progress:.45})),
  h("div",null,h("div",{className:"ac-cap"},"Holding Y, PlayStation, 80%"),h(R.NoticeToast,{kind:"playstation",tone:"finished",title:"Starfall 64 updated",body:"Version 1.4.3. Hold for what changed.",holding:"y",progress:.8})),
  h("div",null,h("div",{className:"ac-cap"},"Keyboard (X and Y keys), failed"),h(R.NoticeToast,{kind:"keyboard",tone:"failed",title:"Download failed: Kart Ruins",body:"The server stopped answering.",holding:"x",progress:.2})))}
ReactDOM.createRoot(document.getElementById("r")).render(h(App));
</script></body></html>
