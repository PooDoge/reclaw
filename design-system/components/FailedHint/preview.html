<!-- @dsCard group="Progress" height=200 subtitle="Hover a Failed label or badge for the reason in one line; press it for the log" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap">
<style>body{margin:0;padding:16px;background:var(--bg-base);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.cap{font:700 11px/14px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-subtle);margin:0 0 6px}</style></head>
<body><div id="r"></div><script>
var R=window.Reclaw,h=React.createElement;
function App(){return h("div",{className:"col"},
  h("div",null,h("div",{className:"cap"},"Downloads row label, hovered"),h(R.FailedHint,{kind:"label",reason:"This release's download for Linux-X64 is a Windows installer, which Reclaw does not install. Pick another release."})),
  h("div",null,h("div",{className:"cap"},"Status badge (Library hero, game page, capsule), hovered"),h(R.FailedHint,{kind:"badge",reason:"Release asset not found. Check the repository or choose another version."})),
  h("div",null,h("div",{className:"cap"},"Failed before the last restart"),h(R.FailedHint,{kind:"badge",earlier:true})))}
ReactDOM.createRoot(document.getElementById("r")).render(h(App));
</script></body></html>
