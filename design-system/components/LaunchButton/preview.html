<!-- @dsCard group="Deck" height=560 subtitle="Play turns into Stop (desktop) or Resume + Stop (deck); every state in one table" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap">
<style>body{margin:0;padding:24px;background:var(--bg-base);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.cap{font:700 11px/14px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-subtle);margin:0 0 6px}body{background:var(--deck-bg)}</style></head>
<body><div id="r"></div><script>
var R=window.Reclaw,h=React.createElement;
function App(){return h("div",{style:{display:"grid",gridTemplateColumns:"260px 1fr",gap:"18px 24px",alignItems:"center",color:"var(--ink-muted)",font:"400 16px var(--font-sans)"}},[
["Installed, idle","play"],["Update ready","update"],["Not installed","install"],["Installing","installing"],["Starting","starting"],["Running (deck)","resume",true],["Running (desktop)","stop"],["Stopping: press again to force","force"],["Last run failed","retry",false,"Exited with code 3. The log has details."]
].map(function(r,i){return [h("span",{key:"l"+i},r[0]),h(R.LaunchButton,{key:"b"+i,verb:r[1],pair:r[2],message:r[3]})]}))}
ReactDOM.createRoot(document.getElementById("r")).render(h(App));
</script></body></html>
