[package]
name = "reclaw"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Reclaw launcher: the catalog, the library, and both interfaces."

build = "build.rs"

[lib]
name = "reclaw_app"
path = "src/lib.rs"

[[bin]]
name = "reclaw"
path = "src/main.rs"

[features]
# Real gamepad reading (needs libudev on Linux).
gamepad = ["reclaw-ui/gamepad"]

[dependencies]
freya = { version = "=0.5.0-rc.8", features = ["router", "radio", "query", "borderless", "titlebar", "markdown", "engine"] }
thiserror = "2"
tracing = "0.1"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
reclaw-catalog = { path = "../reclaw-catalog" }
reclaw-config = { path = "../reclaw-config" }
reclaw-games = { path = "../reclaw-games" }
reclaw-input = { path = "../reclaw-input" }
reclaw-install = { path = "../reclaw-install" }
reclaw-log = { path = "../reclaw-log" }
reclaw-media = { path = "../reclaw-media" }
reclaw-mods = { path = "../reclaw-mods" }
reclaw-net = { path = "../reclaw-net" }
reclaw-runtime = { path = "../reclaw-runtime" }
reclaw-sync = { path = "../reclaw-sync" }
reclaw-ui = { path = "../reclaw-ui" }

[dev-dependencies]
reclaw-net = { path = "../reclaw-net", features = ["testing"] }
tempfile = "3"
serde_json = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
