[package]
name = "reclaw-sync"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
reclaw-catalog = { path = "../reclaw-catalog" }
reclaw-net = { path = "../reclaw-net" }
serde = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
reclaw-net = { path = "../reclaw-net", features = ["testing"] }
tempfile = "3"
reclaw-log = { path = "../reclaw-log" }
