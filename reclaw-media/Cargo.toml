[package]
name = "reclaw-media"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
thiserror = "2"
url = "2"
futures-channel = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
# The same build the UI toolkit already pulls in for remote images, so this adds no new TLS stack.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "http2", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
