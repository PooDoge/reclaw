[package]
name = "reclaw-mods"
version = "0.1.0"
edition = "2024"
publish = false
description = "Mods for the apps in the library: listing them on Thunderstore and GameBanana, installing, updating and removing them."

[dependencies]
reclaw-catalog = { path = "../reclaw-catalog" }
reclaw-games = { path = "../reclaw-games" }
reclaw-install = { path = "../reclaw-install" }
reclaw-net = { path = "../reclaw-net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
reclaw-net = { path = "../reclaw-net", features = ["testing"] }
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
