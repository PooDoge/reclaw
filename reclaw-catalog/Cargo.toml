[package]
name = "reclaw-catalog"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
reclaw-games = { path = "../reclaw-games" }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps keys in the order the format specifies when an entry is written.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
sha2 = "0.10"
url = "2"

[dev-dependencies]
tempfile = "3"
